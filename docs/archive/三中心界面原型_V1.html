<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五六零 · 三中心设计原型</title>
<style>
:root{--blue:#087fc2;--ink:#183e57;--muted:#6d8798;--line:#dce8ef;--bg:#f3f7fa;--accent:#e8f4fc}*{box-sizing:border-box}body{margin:0;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f5b866;outline-offset:3px}button:disabled{cursor:default;opacity:.6}.review{padding:11px 24px;background:#143c57;color:#cbdfe9;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px}.switch{display:flex;gap:4px;background:#ffffff13;padding:4px;border-radius:9px}.switch button{border:0;border-radius:6px;background:none;color:#d6e8f3;padding:5px 17px;font-size:12px}.switch button[aria-pressed=true]{background:white;color:#125a84}.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 61px)}aside{background:white;border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;margin:0 12px 29px}.logo{background:var(--blue);color:white;border-radius:13px;width:47px;height:47px;display:grid;place-items:center;font-size:23px;font-weight:900;font-style:italic;letter-spacing:-2px}.brand strong{display:block;font-size:15px}.brand small{color:var(--muted);font-size:10px;letter-spacing:2px}.group{color:#93a6b2;font-size:10px;letter-spacing:1px;padding:16px 15px 6px}nav button{border:0;background:none;width:100%;text-align:left;padding:10px 15px;margin:2px 0;color:#688192;border-radius:8px;display:flex;gap:12px;align-items:center}nav button.active{background:var(--accent);color:var(--blue);font-weight:650}nav button:hover{background:#f0f6fa}.navicon{font-size:16px;min-width:19px;opacity:.7}.side-note{margin:auto 10px 0;padding-top:30px;color:#8da1af;font-size:11px}.workspace{min-width:0}header{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffaf;padding:0 35px;gap:12px}.crumb{font-size:12px;color:var(--muted)}.identity{font-size:12px;display:flex;gap:12px;align-items:center}.avatar{width:35px;height:35px;border-radius:11px;background:#d4eff5;color:#2584a1;display:grid;place-items:center;font-size:21px}.badge{font-size:11px;padding:3px 9px;border-radius:5px;display:inline-block;background:#e7f4ec;color:#33846a}.badge.blue{background:#e7f0fb;color:#367cad}.badge.amber{background:#fbf1dc;color:#aa8644}.mobile-toggle{display:none}main{max-width:1400px;margin:auto;padding:32px 35px 28px}.eyebrow{font-size:10px;letter-spacing:2px;color:#7794a6;margin-bottom:8px}h1{font-size:29px;line-height:1.4;margin:0 0 8px;letter-spacing:.5px}h2{font-size:17px;margin:0 0 15px}h3{font-size:14px;margin:0 0 7px}p{margin:0 0 15px}.lead{color:var(--muted);font-size:13px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:18px}.hero{padding:26px 29px;background:linear-gradient(115deg,#e4f3fd,#eefaf8);border:1px solid #cde5ef;border-radius:16px;margin-bottom:23px;display:flex;justify-content:space-between;gap:25px;align-items:center}.hero p{font-size:12px;color:#668da2;margin:8px 0}.hero-mark{font-size:68px;line-height:1;font-weight:800;letter-spacing:-6px;color:#128bc323;flex-shrink:0}.columns{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.card{padding:23px;background:white;border:1px solid var(--line);border-radius:13px;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.module{padding:19px;border:1px solid var(--line);border-radius:11px;background:white;min-height:160px;text-align:left;color:var(--ink);position:relative}.module:hover{border-color:#74b7dd;box-shadow:0 5px 15px #18658a08}.module>span:first-child{display:inline-grid;width:33px;height:33px;place-items:center;background:var(--accent);border-radius:9px;font-size:17px;margin-bottom:13px}.module p{font-size:11px;color:var(--muted);margin:0 0 14px}.module small{font-size:10px;color:#4392bc}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:19px}.stat span{font-size:12px;color:var(--muted)}.stat strong{font-size:28px;display:block;margin:8px 0;color:#397799}.stat small{font-size:10px;color:#98aab6}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.tag{border:1px solid #d7e5ee;background:#f7fafc;color:#6c8799;border-radius:6px;padding:5px 10px;font-size:11px}.tag[aria-pressed=true]{background:#e7f5fd;border-color:#7ebddc;color:#177caf}.fine{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #ecf1f5}.row:last-child{border-bottom:0}.row p{margin:2px 0;font-size:11px;color:var(--muted)}.primary{border:0;border-radius:7px;padding:10px 15px;background:var(--blue);color:white;font-size:12px}.secondary{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;color:#527e96;font-size:12px}.flow{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.flow span{padding:8px 12px;background:#f1f7fb;border:1px solid #e0ebf2;border-radius:6px;font-size:12px}.callout{border-left:3px solid #74b9db;background:#f1f8fc;padding:13px 17px;font-size:12px;color:#51768d;margin-top:20px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;min-width:600px;width:100%;text-align:left;font-size:12px}th{color:#83a0b1;font-size:11px;font-weight:500;background:#f7fafc}td,th{padding:13px;border-bottom:1px solid #e6eef3}.yes{color:#23987a}.no{color:#b0bfca}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.field{font-size:11px;color:#7c97a8}.value{padding:10px 13px;border:1px solid #dce7ee;border-radius:7px;background:#fbfdfe;color:#365f77;margin-top:6px;font-size:13px}.empty{padding:25px 12px;text-align:center;color:#7792a3;background:#f8fbfd;border:1px dashed #d2e3ed;border-radius:9px}.empty strong{display:block;color:#5d8096;font-weight:500;margin-bottom:7px}.empty p{font-size:11px;margin:0}.status{min-height:18px;color:#32856e;font-size:11px}footer{text-align:center;font-size:10px;color:#9aabb7;padding:0 20px 25px}.scope{border:1px solid #d5e6ef;padding:5px 10px;border-radius:6px;color:#53829c;background:#f8fcfe;font-size:11px}.back{font-size:12px;color:#7194a8;text-decoration:none}.module .badge{position:absolute;top:18px;right:12px;font-size:9px}
@media(max-width:1100px){.columns{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.review{padding:9px 13px;align-items:stretch;flex-direction:column;gap:7px}.switch button{flex:1;padding:6px 8px}.shell{display:block}.shell aside{display:none}.shell.menu-open aside{display:flex;border-bottom:1px solid var(--line)}.side-note{display:none}.brand{margin-bottom:8px}header{padding:0 18px;height:65px}.mobile-toggle{display:block;border:1px solid var(--line);border-radius:6px;background:white;color:#337fa6;padding:5px 10px}.identity .scope{display:none}main{padding:24px 18px}.cards{gap:10px}.module{padding:15px;min-height:170px}.module .badge{position:static;margin-bottom:7px}.heading{align-items:flex-start}.heading .scope{display:none}h1{font-size:25px}.hero{padding:20px}.hero-mark{display:none}.card{padding:19px}.fields{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:15px}.crumb{font-size:10px}.identity{font-size:10px;gap:6px}}
</style></head><body>
<div class="review"><span><b>设计评审 · V1</b>　示例身份与页面，不连接业务数据</span><div class="switch" aria-label="设计中心切换"><button data-center="user" aria-pressed="true">用户中心</button><button data-center="manage" aria-pressed="false">管理中心</button><button data-center="admin" aria-pressed="false">系统后台</button></div></div>
<div class="shell" id="shell"><aside><div class="brand"><div class="logo">560</div><div><strong id="brand-title">我的小镇</strong><small>五六零人工智能科技</small></div></div><nav id="nav" aria-label="中心导航"></nav><div class="side-note">学习 · 创业 · 生活<br>在北海，与 AI 的未来相遇</div></aside><div class="workspace"><header><button class="mobile-toggle" aria-expanded="false" id="menu-toggle">菜单</button><div class="crumb" id="crumb"></div><div class="identity"><span class="scope" id="scope"></span><div class="avatar">≈</div><span id="identity"></span></div></header><main id="main"></main><footer>五六零人工智能科技（北海）有限公司 · 三中心界面设计原型</footer></div></div>
<script>
const menus={user:[['我的空间',[['我的概览','⌂'],['个人资料','◎'],['身份与标签','◇']]],['我的参与',[['我的学习','▤'],['我的任务与活动','☑'],['我的项目','▧'],['我的店铺与作品','▦'],['我的社区','♧']]],['账户服务',[['我的申请','≡'],['消息中心','◉'],['账户与安全','⚙']]]],manage:[['工作台',[['运营概览','⌂'],['居民管理','◎']]],['七区运营',[['AI服务中心','◇'],['AI学院','▤'],['AI创业园','▧'],['AI商业街','▦'],['任务广场','☑'],['AI社区','♧'],['五六零AI广场','◈']]],['内容运营',[['欢迎页与公司介绍','▣'],['公告管理','≡'],['NPC话语','◌'],['我的工作记录','↺']]]],admin:[['系统控制',[['系统概览','⌂'],['工作人员','◎'],['角色与权限','◇'],['组织与数据范围','▧']]],['规则与配置',[['身份与认证规则','☑'],['模块配置','▦'],['系统设置','⚙']]],['审计与维护',[['全局审计','≡'],['维护状态','↺']]]]};
const names={user:'我的小镇',manage:'小镇运营管理中心',admin:'系统管理后台'};
const descriptions={'我的学习':'查看已加入的班级与获得授权的课程。','我的任务与活动':'集中查看报名、任务提交与处理结果。','我的项目':'查看参与的团队、项目与成员职责。','我的店铺与作品':'管理获准经营的店铺与自己的作品。','我的社区':'查看自己的发布、互动与社区消息。','我的申请':'查看认证和入驻申请的处理进度。','消息中心':'接收审批结果、课程通知与任务提醒。','账户与安全':'查看登录方式，管理自己的账户会话。','AI服务中心':'管理认证申请、服务介绍和处理结果。','AI学院':'管理课程、班级、课堂与学员授权。','AI创业园':'管理团队、共创项目与园区入驻。','AI商业街':'管理店铺、AI工具、作品与展示状态。','任务广场':'管理任务、活动、参与记录与成果审核。','AI社区':'管理社区公告、话题和内容审核。','五六零AI广场':'管理公共活动、新手引导与推荐内容。','欢迎页与公司介绍':'维护欢迎页介绍、公司简介与展示文案。','公告管理':'按展示位置管理公告的草稿、发布和下架。','NPC话语':'按街区维护与当前场景相符的随机话语。','我的工作记录':'查看自己处理的事项与操作记录。','工作人员':'分配工作人员岗位、模块动作与管理范围。','组织与数据范围':'限定学校、组织、班级和街区的数据边界。','身份与认证规则':'定义认证条件、审批流程与身份授予规则。','模块配置':'管理业务模块开放状态，保留历史数据。','系统设置':'管理关键系统配置，敏感密钥不回显。','全局审计':'追溯人员授权、发布、审批和关键配置变更。','维护状态':'查看服务运行与配置状态，运维操作分批开放。'};
let center='user',page='我的概览';
const card=(title,text,badge='筹备中')=>`<button class="module" data-page="${title}"><span>◇</span><span class="badge ${badge==='基础功能'?'blue':'amber'}">${badge}</span><h3>${title}</h3><p>${text}</p><small>查看页面设计 ↗</small></button>`;
const empty=(title,text)=>`<div class="empty"><strong>${title}</strong><p>${text}</p></div>`;
const stats=labels=>`<div class="stats">${labels.map(x=>`<div class="stat"><span>${x}</span><strong>—</strong><small>接入真实数据后显示</small></div>`).join('')}</div>`;
const intro=(title,text)=>`<div class="heading"><div><div class="eyebrow">560 AI TOWN / ${center==='user'?'MY SPACE':center==='manage'?'OPERATIONS':'SYSTEM'}</div><h1 tabindex="-1">${title}</h1><p class="lead">${text}</p></div><span class="scope">${center==='user'?'个人空间':center==='manage'?'按岗位与范围授权':'仅超级管理员'}</span></div>`;
function userHome(){return intro('你好，欢迎回到我的小镇','从学习到共创，在这里找到属于自己的方向。')+`<div class="hero"><div><span class="badge blue">小镇居民 · 示例身份</span><h2 style="margin:12px 0 0">你的 AI 探索，从这里开始</h2><p>公共空间向你开放。更多身份与业务功能将逐步上线。</p><button class="secondary" data-page="身份与标签">查看我的身份 →</button></div><div class="hero-mark">560</div></div><div class="columns"><div><h2>我的功能</h2><div class="cards">${['我的学习','我的任务与活动','我的项目','我的店铺与作品','我的社区','我的申请'].map(x=>card(x,descriptions[x])).join('')}</div></div><div><section class="card"><h2>我的兴趣</h2><p class="fine">选择感兴趣的方向，不改变账户权限。</p><div class="tags">${['AI办公','AI绘画','AI编程','AI视频','AI教育','AI创业'].map((x,i)=>`<button class="tag" data-tag aria-pressed="${i<2}">${x}</button>`).join('')}</div><div class="status" role="status" id="tag-status">可点击体验，原型不保存选择</div></section><section class="card"><h2>我的消息</h2>${empty('消息服务待接入','接入后显示属于你的通知和待办。')}</section></div></div>`;}
function profile(){return intro('个人资料','让伙伴认识你，从一份简单的介绍开始。')+`<section class="card"><div class="row"><div><span class="avatar">≈</span></div><div><b>示例居民</b><p>预设头像 · 小镇居民</p></div><span class="badge blue">本人可编辑</span></div><div class="fields">${[['昵称','示例居民'],['注册手机号','手机号脱敏显示'],['个人简介','写下你的兴趣与正在探索的方向'],['身份','小镇居民 · 系统授予']].map(([a,b])=>`<div class="field">${a}<div class="value">${b}</div></div>`).join('')}</div><button class="primary" disabled>保存资料（设计展示）</button><div class="callout">普通资料可以自己修改，认证身份和资源权限由对应业务流程授予。</div></section>`;}
function identities(){return intro('身份与标签','兴趣属于你，资格与权限有清楚的来源。')+`<div class="columns"><section class="card"><h2>我的业务身份</h2><div class="row"><div><b>小镇居民</b><p>注册后自动获得 · 可游览公共区域</p></div><span class="badge">默认身份</span></div>${['学员认证','OPC共创认证'].map(x=>`<div class="row"><div><b>${x}</b><p>后续在服务中心查看条件并提交申请</p></div><span class="badge amber">筹备中</span></div>`).join('')}<div class="callout">成为学员后，还需要具体课程或班级授权。业务认证不会授予后台管理权限。</div></section><section class="card"><h2>标签如何使用</h2><div class="row"><div><b>兴趣标签</b><p>由本人选择</p></div></div><div class="row"><div><b>认证身份</b><p>审批或授权产生，本人只读</p></div></div><div class="row"><div><b>资源权限</b><p>指向具体课程、项目或店铺</p></div></div></section></div>`;}
function manageHome(){return intro('把小镇的每一天，运营好','各司其职，清楚看到自己负责的内容与待办。')+stats(['我的待办','待发布内容','授权街区','近期处理事项'])+`<div class="columns"><section class="card"><h2>我的工作台</h2>${empty('待办将根据岗位生成','审批、教学与任务业务接入后，仅显示你有权处理的事项。')}<div class="row"><div><b>内容运营</b><p>欢迎介绍、公告与分街区NPC话语</p></div><button class="secondary" data-page="NPC话语">查看设计 →</button></div><div class="row"><div><b>居民管理</b><p>现有功能迁入，按权限查看和处理账户</p></div><button class="secondary" data-page="居民管理">查看设计 →</button></div></section><section class="card"><h2>岗位与数据范围</h2><span class="badge blue">评审视图 · 完整菜单</span><p class="fine" style="margin-top:15px">这里展示全部模块供评审。正式工作人员只看到被授权的菜单和数据。</p><div class="callout">管理内容不等于管理账号；管理一个学校不等于管理全镇。</div></section></div>`;}
function residents(){return intro('居民管理','按授权范围查看用户，账户处理会留下操作记录。')+`<section class="card"><div class="fields"><div class="field">查询条件<div class="value">搜索昵称 / 手机号</div></div><div class="field">账户状态<div class="value">全部状态 / 正常 / 已停用</div></div></div><div class="table-wrap"><table><thead><tr>${['居民','手机号','业务身份','所属组织','账户状态','操作'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td colspan="6">设计原型未载入居民数据</td></tr></tbody></table></div><div class="callout">全局停用仅向获授权的用户管理员开放；教师只能管理自己负责班级的成员资格。</div></section>`;}
function systemHome(){return intro('系统管理后台','让每一项权限与规则都有明确的边界。')+`<div class="hero"><div><span class="badge blue">超级管理员专属</span><h2 style="margin:12px 0 0">一套账户，三个清晰的工作空间</h2><p>管理人员与规则，日常内容和业务处理统一进入运营中心。</p></div><div class="hero-mark">560</div></div>${stats(['工作人员','权限角色','已开放模块','关键配置状态'])}<div class="cards">${['工作人员','角色与权限','模块配置','身份与认证规则','全局审计','系统设置'].map(x=>card(x,descriptions[x]||'定义模块操作与数据范围。','基础功能')).join('')}</div>`;}
function permission(){return intro('角色与权限','授予需要的动作，同时限定可操作的数据。')+`<section class="card"><h2>示例角色：内容运营员</h2><p class="fine">下表是拟定的权限配置示例，尚未保存或授予任何实际账户。</p><div class="table-wrap"><table><thead><tr><th>模块</th><th>查看</th><th>编辑</th><th>发布</th><th>分配权限</th><th>数据范围</th></tr></thead><tbody>${[['七区介绍','✓','✓','单独授权','—','指定街区'],['NPC话语','✓','✓','单独授权','—','指定街区'],['居民账户','—','—','—','—','无'],['系统配置','—','—','—','—','无']].map(r=>`<tr>${r.map((v,i)=>`<td class="${v==='✓'?'yes':v==='—'?'no':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="flow"><span>① 角色信息</span><span>② 模块动作</span><span>③ 数据范围</span><span>④ 授权预览</span></div><div class="callout">保存前显示新增与收回权限；不能撤销最后一位超级管理员。界面隐藏不能代替服务端鉴权。</div></section>`;}
function modulePage(){const user=center==='user',system=center==='admin';const parts=user?['我的记录','当前资格','相关通知']:system?['配置范围','权限边界','变更记录']:['基础内容','业务管理','操作记录'];return intro(page,descriptions[page]||'查看当前模块的职责与设计范围。')+`<section class="card"><span class="badge ${user?'amber':'blue'}">${user?'后续业务 · 筹备中':'模块页面设计'}</span><div class="flow">${parts.map(x=>`<span>${x}</span>`).join('')}</div>${page==='NPC话语'?`<div class="fields"><div class="field">所属街区<div class="value">五六零AI商业街</div></div><div class="field">状态<div class="value">草稿 / 已发布 / 已下架</div></div></div><div class="value">示例话语：你也来商业街看看有什么好玩的 AI 呀？</div><div class="callout">保存草稿不影响前台；发布后，商业街NPC随机抽取已发布话语。</div>`:page==='工作人员'?`<div class="fields"><div class="field">选取已注册账户<div class="value">通过手机号 / 昵称查询</div></div><div class="field">分配岗位<div class="value">岗位角色 + 模块动作 + 数据范围</div></div></div><div class="callout">工作人员资格与业务身份分开；居民不能自行获得管理权限。</div>`:empty(user?'业务开放后，这里显示你的记录':'此区域展示模块的真实记录',user?'没有资格时展示申请条件；尚未开发时明确标记筹备中。':'原型不载入真实数据，也不提供生效的保存操作。')}<h3 style="margin-top:24px">页面边界</h3><p class="fine">${user?'只显示属于本人或已授权的内容。':system?'仅超级管理员可以访问，关键变更记录审计；敏感密钥不回显。':'根据岗位权限和数据归属校验每次操作。七区基础内容和具体业务分批上线。'}</p></section>`;}
function render(focus=false){document.getElementById('brand-title').textContent=names[center];document.getElementById('crumb').textContent=names[center]+' / '+page;document.getElementById('identity').textContent={user:'示例居民',manage:'示例工作人员',admin:'示例超级管理员'}[center];document.getElementById('scope').textContent={user:'仅本人数据',manage:'岗位与范围授权',admin:'系统权限'}[center];document.getElementById('nav').innerHTML=menus[center].map(([group,items])=>`<div class="group">${group}</div>${items.map(([label,icon])=>`<button data-page="${label}" class="${label===page?'active':''}" ${label===page?'aria-current="page"':''}><span class="navicon" aria-hidden="true">${icon}</span>${label}</button>`).join('')}`).join('');document.querySelectorAll('[data-center]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.center===center)));const content=page==='我的概览'?userHome():page==='个人资料'?profile():page==='身份与标签'?identities():page==='运营概览'?manageHome():page==='居民管理'?residents():page==='系统概览'?systemHome():page==='角色与权限'?permission():modulePage();document.getElementById('main').innerHTML=content;if(focus)document.querySelector('h1').focus({preventScroll:true});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.center){center=b.dataset.center;page=menus[center][0][1][0][0];render(true);window.scrollTo(0,0);}else if(b.dataset.page){page=b.dataset.page;render(true);document.getElementById('shell').classList.remove('menu-open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');window.scrollTo(0,0);}else if(b.hasAttribute('data-tag')){const active=b.getAttribute('aria-pressed')==='true';const count=document.querySelectorAll('[data-tag][aria-pressed=true]').length;if(!active&&count>=5){document.getElementById('tag-status').textContent='最多选择5项兴趣';return;}b.setAttribute('aria-pressed',String(!active));document.getElementById('tag-status').textContent='选择已在原型中更新，未保存到账户';}else if(b.id==='menu-toggle'){const shown=document.getElementById('shell').classList.toggle('menu-open');b.setAttribute('aria-expanded',String(shown));}});render();
</script></body></html>
